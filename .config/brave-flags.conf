# ~/.config/brave-flags.conf
#
# Flags persistentes de Brave. Los lee el wrapper /usr/bin/brave del paquete
# cachyos/brave-bin (una linea por flag, "#" para comentarios).
#
# Deliberadamente NO se anaden los "flags magicos" de rendimiento que circulan
# por internet. En un navegador Chromium son o inexistentes o dannos:
#   --disable-gpu        -> desactiva la aceleracion por hardware (peor)
#   --no-sandbox         -> elimina una barrera de seguridad
#   --single-process      -> inestable y sin soporte
#   --js-flags=--max-old-space-size=N -> mito, no aplica al proceso de render
#   --disable-extensions -> te quita Extensiones y la proteccion que aportan
#
# Lo que si se aplica, por motivos concretos:

# Brave ya es el navegador predeterminado (mimeapps.list + $BROWSER), asi que
# la comprobacion al arrancar y el aviso "definir como navegador" son ruido.
--no-default-browser-check

# Evita el globo "se ha cerrado inesperadamente" al reabrir el navegador.
--disable-session-crashed-bubble

# Aceleracion grafica y decodificacion de video por hardware (Intel Alder Lake-N iGPU)
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoDecoder,TouchpadOverscrollHistoryNavigation

# Gestor de contrasenias: NO tocar. Comprobado en esta maquina:
#   libsecret 0.21.8.2  -> instalado (core), libsecret-1.so.0 presente
#   gnome-keyring 1:50  -> instalado, org.freedesktop.secrets en el bus
# Brave esta compilado con soporte libsecret (chrome_libsecret_os_crypt_
# password_v2), asi que las contrasenas se cifran en el llavero del sistema.
# NOTA: el paquete Debian "libgnome-keyring" NO existe en Arch; el equivalente
# es libsecret, y ya venia instalado. No instalar nada aqui.
# --password-store=basic solo como ultimo recurso: guardaria las contrasenas
# SIN cifrar dentro del perfil.

# Gestor de color. Comentar para no forzar: solo activalo si notas colores
# desvaidos con Wayland y tu panel es sRGB.
# --force-color-profile=srgb