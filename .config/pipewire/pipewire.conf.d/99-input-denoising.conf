# This file is yours. hyprsimple copies it once and never touches it again,
# so anything you change here stays changed. Delete it to turn microphone
# noise suppression off.
#
# A WirePlumber smart filter. It sits in front of whichever microphone is the
# default, so choosing a microphone with SUPER + S keeps noise suppression on
# it, and applications that record from the default microphone hear the cleaned
# signal without having to pick "Noise Canceling source" themselves.

context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description =  "Noise Canceling source"
        media.name =  "Noise Canceling source"
        filter.graph = {
            nodes = [
                {
                    type = ladspa
                    name = rnnoise
                    plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                    label = noise_suppressor_mono
                    control = {
                        "VAD Threshold (%)" = 90.0
                        "VAD Grace Period (ms)" = 200
                        "Retroactive VAD Grace (ms)" = 0
                    }
                }
            ]
        }
        capture.props = {
            node.name =  "capture.rnnoise_source"
            node.passive = true
            audio.rate = 48000
        }
        playback.props = {
            node.name =  "rnnoise_source"
            media.class = Audio/Source
            audio.rate = 48000

            # Smart: WirePlumber places this in front of the microphone it
            # would otherwise link to. With no filter.smart.target it follows
            # the default source, which is what the audio menu sets.
            filter.smart = true
            filter.smart.name = "hyprsimple.rnnoise"
        }
    }
}
]
