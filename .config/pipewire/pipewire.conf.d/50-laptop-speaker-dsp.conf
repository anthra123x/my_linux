# Vivobook Go Laptop Speaker Acoustic Equalization and Anti-Plastic Warm Tuning
#
# WirePlumber smart filter targeting the internal laptop speaker:
# alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink
#
# Acoustic Tuning Profile:
# - Preamp headroom attenuation: -5.5 dB (linear mult: 0.531) to prevent DAC clipping
# - Subsonic flutter & chassis protection: HPF 60 Hz (Q: 0.707)
# - Low-volume bass impact / punch: 115 Hz +6.5 dB (Q: 1.2)
# - Low-volume body & warmth: 200 Hz +5.0 dB (Q: 1.3)
# - Chassis resonance reduction (anti-plastic / anti-boxiness): 450 Hz -4.5 dB (Q: 1.6)
# - Cavity hollow resonance reduction: 850 Hz -3.0 dB (Q: 1.8)
# - Mid-band vocal body stabilization: 1200 Hz +1.0 dB (Q: 1.0)
# - Cone breakup / harshness taming: 3200 Hz -3.5 dB (Q: 1.6)
# - High-frequency sibilance smoothing: 6200 Hz -3.5 dB (Q: 2.0)
# - Silky high roll-off (anti-piercing): High-shelf 8500 Hz -2.5 dB (Q: 0.707)

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Laptop Speaker Acoustic DSP"
            media.name       = "Laptop Speaker Acoustic DSP"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = preamp
                        label = linear
                        control = { "Mult" = 0.531 "Add" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_hpf
                        label = bq_highpass
                        control = { "Freq" = 60.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_bass_punch
                        label = bq_peaking
                        control = { "Freq" = 115.0 "Q" = 1.2 "Gain" = 6.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_bass_warmth
                        label = bq_peaking
                        control = { "Freq" = 200.0 "Q" = 1.3 "Gain" = 5.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_debox
                        label = bq_peaking
                        control = { "Freq" = 450.0 "Q" = 1.6 "Gain" = -4.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_decan
                        label = bq_peaking
                        control = { "Freq" = 850.0 "Q" = 1.8 "Gain" = -3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_mid_body
                        label = bq_peaking
                        control = { "Freq" = 1200.0 "Q" = 1.0 "Gain" = 1.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_deharsh
                        label = bq_peaking
                        control = { "Freq" = 3200.0 "Q" = 1.6 "Gain" = -3.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_desibilance
                        label = bq_peaking
                        control = { "Freq" = 6200.0 "Q" = 2.0 "Gain" = -3.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_warm_top
                        label = bq_highshelf
                        control = { "Freq" = 8500.0 "Q" = 0.707 "Gain" = -2.5 }
                    }
                ]
                links = [
                    { output = "preamp:Out" input = "eq_hpf:In" }
                    { output = "eq_hpf:Out" input = "eq_bass_punch:In" }
                    { output = "eq_bass_punch:Out" input = "eq_bass_warmth:In" }
                    { output = "eq_bass_warmth:Out" input = "eq_debox:In" }
                    { output = "eq_debox:Out" input = "eq_decan:In" }
                    { output = "eq_decan:Out" input = "eq_mid_body:In" }
                    { output = "eq_mid_body:Out" input = "eq_deharsh:In" }
                    { output = "eq_deharsh:Out" input = "eq_desibilance:In" }
                    { output = "eq_desibilance:Out" input = "eq_warm_top:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name           = "effect_input.laptop_speaker_dsp"
                node.description    = "Laptop Speaker Acoustic DSP"
                media.class         = Audio/Sink
                node.link-group     = "laptop_speaker_dsp"
                filter.smart        = true
                filter.smart.name   = "laptop_speaker_dsp"
                filter.smart.target = "{ \"node.name\": \"alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink\" }"
            }
            playback.props = {
                node.name           = "effect_output.laptop_speaker_dsp"
                node.description    = "Laptop Speaker DSP Output"
                node.passive        = true
                node.link-group     = "laptop_speaker_dsp"
                filter.smart        = true
                filter.smart.name   = "laptop_speaker_dsp"
                filter.smart.target = "{ \"node.name\": \"alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink\" }"
                target.object       = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
            }
        }
    }
]
