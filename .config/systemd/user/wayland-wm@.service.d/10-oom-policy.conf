[Unit]
# Que un OOM no destruya la sesion.
#
# POR QUE ESTA ESTE DROP-IN
# wayland-wm@.service corre con OOMPolicy=stop (el default de systemd). Cuando
# el OOM killer del kernel mata un proceso que esta DENTRO del cgroup de este
# servicio, systemd marca el servicio como fallido y dispara sus dependencias
# OnFailure=, lo que desmonta la sesion entera y deja al usuario en el greeter.
#
# El cgroup de wayland-wm@ agrupa al compositor y a las apps que se lanzan
# desde el, no a las que systemd mete en app-*.scope. Con 8 GB de RAM, un pico
# de memoria en una app pesada (un IDE de Electron) dispara el OOM killer y
# con OOMPolicy=stop eso se traducia en: pierdo la sesion y todo lo que tenia
# abierto.
#
# continue = si matan a una app, la app muere y la sesion sigue viva. Es
# exactamente el comportamiento pedido: que un proceso no tumbe el escritorio.
#
# NO se sube a un drop-in de /etc: este servicio es del usuario (esta en
# /usr/lib/systemd/user/), asi que el override del usuario alcanza y no hace
# falta root.
[Service]
OOMPolicy=continue
# -900 deja al compositor practicamente fuera del alcance del OOM killer, al
# mismo nivel que systemd-oomd. Antes venia en -150, que todavia lo dejaba en
# la lista de candidatos: si fallaba la reserva de memoria, el kernel podia
# elegirlo y ahi si se perdia la sesion de verdad.
OOMScoreAdjust=-900
