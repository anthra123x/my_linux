# Late Night Kitty Theme by 1amSimp1e / Mr_S1mpleman
# Wayland integration
linux_display_server wayland
wayland_titlebar_color background

# Font
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Translucent background & blur
background_opacity 0.85

# Window settings
window_padding_width 18
confirm_os_window_close 0

# Cursor
cursor_shape beam
cursor_trail 1
cursor #cbced3
cursor_text_color #a5b6cf

# Selection highlight
selection_foreground #a5b6cf
selection_background #1c1e27

# Special colors
background #14151e
foreground #98b0d3

# Black
color0 #151720
color8 #4f5572

# Red
color1 #dd6777
color9 #e26c7c

# Green
color2  #90ceaa
color10 #95d3af

# Yellow
color3  #ecd3a0
color11 #f1d8a5

# Blue
color4  #86aaec
color12 #8baff1

# Magenta
color5  #c296eb
color13 #c79bf0

# Cyan
color6  #93cee9
color14 #98d3ee

# White
color7  #cbced3
color15 #d0d3d8

# URLs
url_color #5de4c7

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f        launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up       scroll_page_up
map page_down     scroll_page_down
map ctrl+plus     change_font_size all +1
map ctrl+equal    change_font_size all +1
map ctrl+minus    change_font_size all -1
map ctrl+0        change_font_size all 0
