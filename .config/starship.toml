# This file is yours. hyprsimple copies it once and never touches it again,
# so anything you change here stays changed.

"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_mocha'
# [pastel, pastel_brite, catppuccin_mocha]

format = """
[╭](gray)\
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$kotlin\
$nodejs\
$nim\
$php\
$python\
$rust\
$scala\
$conda\
$docker_context\
$pixi\
$time\
$cmd_duration\
$line_break\
[╰](gray)\
$character
"""

[username]
disabled = false
show_always = true
# symbol = "󰀄"
format = '[$user ]($style)'

[os]
disabled = false

[os.symbols]
Arch = " 󰣇 "

[directory]
disabled = false
# home_symbol = ""
format = "[  $path ]($style)"
truncation_length = 3

# Shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
# [directory.substitutions]
# "/Documents" = "/󰈙 "
# "/Downloads" = "/ "
# "/Music" = "/ "
# "/Pictures" = "/ "
# "/Videos" = "/ "
# "/Audios" = "/ "
# "/GitHub" = "/ "
# "/.config" = "/ "
# "/Develop" = "/󰲋 "
# Keep in mind that the order matters. For example:
# "/Important Documents" = "/󰈙 "
# will not be replaced, because "/Documents" was already substituted before.
# So either put "/Important Documents" before "/Documents" or use the substituted version:
# "/Important 󰈙 " = "/󰈙 "

[time]
disabled = false
time_format = "%R"
format = '[  $time ]($style)'

[cmd_duration]
disabled = false
show_milliseconds = true
min_time = 100
format = "[  in $duration ]($style)"
style = "fg:lavender"

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'

[git_branch]
symbol = ""
format = '[ $symbol $branch ]($style)'

[git_status]
disabled = true
ahead = " $count "
behind = " $count "
deleted = "﫧 $count "
diverged = " $count "
stashed = " $count "
modified = " $count "
staged = " $count "
renamed = " $count "
untracked = " $count "
format = '[($all_status$ahead_behind)]($style)'

[lua]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[conda]
symbol = ""
format = '[ $symbol ($environment) ]($style)'
ignore_base = false

[docker_context]
symbol = ""
format = '[ $symbol ($context) ]($style)'

[pixi]
format = '[ $symbol ($version) ($environment) ]($style)'

[c]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[elixir]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[gradle]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[java]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[kotlin]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥"
format = '[ $symbol ($version) ]($style)'

[php]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
format = '[ $symbol ($version) ($virtualenv) ]($style)'

[rust]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = ""
format = '[ $symbol ($version) ]($style)'

