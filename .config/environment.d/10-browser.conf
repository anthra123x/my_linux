# Navegador predeterminado del sistema.
#
# Antes debrave (2026-10-12) estas variables apuntaban a Firefox:
#   $BROWSER=firefox   (importada en el entorno de systemd del usuario)
#   x-scheme-handler/{http,https} = firefox.desktop
#
# xdg-settings se niega a escribir default-web-browser mientras $BROWSER
# este definida, y muchas utilidades de CLI (xdg-open, git, herramientas
# de descarga, editores) priorizan $BROWSER sobre el registro XDG.
# environment.d es la unica capa persistente que sobrevive al login.
#
# El registro XDG vive en ~/.config/mimeapps.list (ver HANDOFF-001).
BROWSER=brave