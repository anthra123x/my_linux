# ==============================================================================
# Optimizaciones graficas y aceleracion por hardware (Intel Alder Lake-N)
# ==============================================================================

# Forzar driver moderno Intel Media Driver (iHD) para decodificacion de video VA-API
LIBVA_DRIVER_NAME=iHD
VDPAU_DRIVER=va_gl

# Cache de shaders de Mesa en disco: expande hasta 4 GB en NVMe para eliminar
# tirones/stutter de compilacion de shaders en juegos (Steam/Proton/DXVK) y WebGL
MESA_SHADER_CACHE_MAX_SIZE=4G

# Pipeline caching y subasignacion de memoria en Vulkan (Intel Anvil)
ANV_ENABLE_PIPELINE_CACHE=1
MESA_VK_ENABLE_SUBALLOCATION=1
