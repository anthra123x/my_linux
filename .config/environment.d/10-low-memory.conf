# Redireccion de la cache de compilacion de Node fuera de /tmp.
#
# Node >= 22 usa por defecto os.tmpdir()/node-compile-cache. En esta maquina
# /tmp es tmpfs, es decir RAM. Eso convertia 187 MB de cache de bytecodes en
# RAM resident. Movemos la cache a disco (~/.cache), que es NVMe.
#
# Beneficio: libera 187 MB de RAM y acelera arranques de Node.
NODE_COMPILE_CACHE=/home/omicron/.cache/node-compile-cache
