source=~/.config/hypr/hyprlock/colors.conf

# ============================================================================
# Pantalla de bloqueo, estilo Windows 11 nativo
# ============================================================================
# Win11 no muestra: layout de workspaces, nombre de usuario, ni texto de
# estado con bateria/red/IP. Solo wallpaper atenuado, reloj enorme, fecha y el
# campo de contraseña. Todo centrado. Eso es lo que hay aqui.
#
# Se eliminaron:
#   - label $LAYOUT      -> indicador de layout de workspaces (no existe en Win11)
#   - label Status        -> texto con bateria/red/IP arriba a la izquierda
#   - label User          -> Win11 no escribe el nombre de usuario al bloquear
#
# Se conservo el aviso de Caps Lock porque check-capslock.sh devuelve cadena
# vacia cuando esta apagado: no ocupa espacio ni molesta en el uso normal.

background {
    # Antes este bloque solo traia "color", y por eso el bloqueo se veía con un
    # rectángulo plano: la variable $background_image sí estaba definida (en
    # hyprlock/colors.conf, que genera matugen) pero ninguna regla la usaba.
    #
    # Se referencia la variable en vez de la ruta directa a propósito: así el
    # wallpaper se cambia editando colors.conf (que es lo que regenera
    # matugen) y no este archivo.
    path = $background_image

    # Win11 atenua bastante el wallpaper en la pantalla de bloqueo para que
    # el reloj se lea sin esfuerzo. 0.45 es ese punto.
    blur_passes = 2
    blur_size = 7
    brightness = 0.45
    contrast = 0.95
    noise = 0.015

    # color queda como respaldo: si la imagen no se puede leer, hyprlock
    # pinta este color en vez de dejar la pantalla en negro.
    color = rgba(181818FF)
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    # En Win11 el reloj es lo unico que realmente ves al bloquear: enorme,
    # centrado y con mucho aire alrededor.
    font_size = 128
    font_family = $font_family_clock

    position = 0, 120
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 28
    font_family = $font_family_clock

    position = 0, 5
    halign = center
    valign = center
}

input-field {
    monitor =
    # Win11 usa un campo compacto y redondeado, no una barra ancha.
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true

    # Bajado: en Win11 el campo de contrasena vive en el tercio inferior,
    # separado del reloj.
    position = 0, -140
    halign = center
    valign = center
}

label { # Caps Lock Warning
    monitor =
    # Devuelve cadena vacia si no esta activo, asi que solo aparece cuando
    # importa. Va justo encima del campo, como el indicador de Win11.
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $text_color
    font_size = 15
    font_family = $font_family
    position = 0, -95
    halign = center
    valign = center
}