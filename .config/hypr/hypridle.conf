# ============================================================================
# hypridle: sin bloqueo de pantalla, sin suspender. Solo apaga el monitor.
# ============================================================================
# Que hacia antes, y por que molesta:
#
#     60 s   -> hyprlock                 <- este era el que te bloqueaba la
#                                            pantalla en 1 minuto, no en 5
#    300 s   -> loginctl lock-session    <- segundo bloqueo automatico
#    600 s   -> DPMS off (apagar pantalla)
#    900 s   -> suspender                <- ESTE era el que suspendia la laptop
#                                            a los 15 min de no tocar nada
#
# Ademas general.before_sleep_cmd era "loginctl lock-session": eso bloquea la
# sesion ANTES de suspender, asi que al volver te pedia contrasena. Con la
# laptop durmiendo y sin pedir contrasena, cualquiera que la despierte entra
# directo a tu sesion. Eso es justo lo que pediste, pero conviene saberlo.
#
# AHORA (cambio pedido): la laptop NUNCA se suspende sola. A los 10 minutos de
# inactividad lo unico que pasa es que se apaga la pantalla (DPMS off), y al
# mover el raton o teclear vuelve a encenderse al instante. La sesion sigue
# viva: procesos, descargas y compilaciones siguen corriendo con la pantalla
# apagada, que es justo lo que se busca.
#
# inhibit_sleep = 0
#     El valor anterior era 3. El propio binario de hypridle avisa:
#         "general:inhibit_sleep=3, general:on_lock_cmd and
#          general:on_unlock_cmd will not work."
#     Sin bloqueo automatico no hace falta ningun inhibidor de reposo, asi que
#     se apaga del todo.
#
# /bin/true en vez de dejar los campos vacios: hypridle espera un comando
# ejecutable, y una cadena vacia lo hace fallar al parsear.
#
# before_sleep_cmd / after_sleep_cmd ya no son necesarios (nada duerme solo),
# pero se dejan como /bin/true a proposito: si cierras la tapa, systemd sigue
# suspendiendo, y asi tampoco te pide contrasena al volver.

general {
    # Nunca se bloquea la sesion.
    lock_cmd = /bin/true
    # No se bloquea al suspender: asi al volver entras directo, sin contrasena.
    before_sleep_cmd = /bin/true
    after_sleep_cmd = /bin/true
    inhibit_sleep = 0
}

# ---------------------------------------------------------------------------
# Lo unico que hace hypridle: apagar el monitor a los 10 minutos de inactividad.
# NO suspender, NO bloquear. Cambia el numero para mover el tiempo.
# ---------------------------------------------------------------------------
listener {
    timeout = 600 # 10 minutos de inactividad -> pantalla apagada
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ---------------------------------------------------------------------------
# wallmotion: pausa el fondo animado cuando no hay actividad.
# Antes esto venia atado al bloqueo de pantalla; como ya no hay bloqueo, queda
# como simple ahorro de CPU durante la inactividad.
# ---------------------------------------------------------------------------
listener {
    timeout = 60
    on-timeout = /home/omicron/.local/bin/wallmotion pause
    on-resume = /home/omicron/.local/bin/wallmotion resume
}