# ~/.config/spotify-flags.conf
#
# Flags de aceleracion grafica, Wayland nativo y optimizacion para Spotify en Arch Linux
# Leidos automaticamente por el ejecutable wrapper /usr/bin/spotify

# Forzar Wayland nativo (evita caidas de frames y borrosidad de XWayland)
--enable-features=UseOzonePlatform,VaapiVideoDecodeLinuxGL,VaapiVideoDecoder,CanvasOopRasterization
--ozone-platform=wayland

# Aceleracion por GPU completa para Intel Alder Lake-N (elimina renderizado por software SwiftShader)
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy

# Audio fluido mediante compatibilidad PulseAudio/PipeWire
--audio-api=pulseaudio

# Throttling de interfaz en segundo plano: mantiene el audio fluido pero congela animaciones innecesarias de la UI
--disable-background-timer-throttling=false
