[package]
name = "hypr-workspace-governor"
version = "0.1.0"
edition = "2021"
authors = ["anthra123x"]
description = "Gobernador nativo en Rust para aislamiento y ahorro de recursos por espacio de trabajo en Hyprland"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
